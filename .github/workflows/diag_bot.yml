name: Diag bot
on: workflow_dispatch
permissions: { contents: read }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env: { WT: "${{ secrets.WHAPI_TOKEN }}" }
        run: |
          echo "== /diag"; curl -s -m 60 -w "\nHTTP %{http_code} %{time_total}s\n" https://bot-negobazar.negobazar.deno.net/diag | python3 -c "import sys;t=sys.stdin.read();print(t[:1500])"
          echo "== whapi health"; curl -s -m 30 -H "Authorization: Bearer $WT" https://gate.whapi.cloud/health | head -c 800; echo
          echo "== whapi webhook settings"; curl -s -m 30 -H "Authorization: Bearer $WT" https://gate.whapi.cloud/settings | python3 -c "import sys,json;d=json.load(sys.stdin);print(json.dumps(d.get('webhooks'),indent=1))"
          echo "== ultimos chats"; curl -s -m 30 -H "Authorization: Bearer $WT" "https://gate.whapi.cloud/messages/list?count=15" | python3 -c "
          import sys,json,time
          for m in json.load(sys.stdin).get('messages',[]):
              print(time.strftime('%d/%m %H:%M',time.localtime(m['timestamp']-10800)),'YO' if m.get('from_me') else 'CLI',m.get('chat_id','')[-4:],(m.get('text') or {}).get('body','')[:60].replace(chr(10),' '))"
