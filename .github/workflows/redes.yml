name: Redes - publicar en Instagram y Facebook de NegoBazar

# Horarios Argentina: 10:07 historia · 12:33 carrusel · 17:07 historia · 20:33 posteo + historia
on:
  schedule:
    - cron: "7 13 * * *"
    - cron: "33 15 * * *"
    - cron: "7 20 * * *"
    - cron: "33 23 * * *"
  workflow_dispatch:
    inputs:
      momento: {description: "manana | mediodia | tarde | noche (vacio = segun la hora)", default: ""}
      rama: {description: "rama con el contenido (dia | redes-hoy)", default: "dia"}

concurrency:
  group: redes
  cancel-in-progress: false

permissions:
  contents: read

env:
  FB_PAGE_ID: "100119982130545"      # NegoBazar
  IG_USER_ID: "17841446090928334"    # @negobazar

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          REDES_RAMA: ${{ inputs.rama || 'dia' }}
        run: python tools/redes_publicar.py "${{ inputs.momento }}"
