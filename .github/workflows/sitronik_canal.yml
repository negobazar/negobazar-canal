name: Sitronik - canal de WhatsApp (difusiones del día)

# Todos los días a las 09:15 (Argentina) arma las placas del día leyendo tiendasitronik.com.ar
# y las publica en el canal de Sitronik en los horarios de sitronik/canal/config.json.
# Para probar sin publicar: Actions > este workflow > Run workflow > modo "solo_placas"
# y descargar las placas desde "Artifacts".
on:
  schedule:
    - cron: "15 12 * * *"   # 09:15 Argentina
  workflow_dispatch:
    inputs:
      modo:
        description: "solo_placas = arma sin publicar · prueba = publica UNA placa ahora · normal = publica el día"
        default: "solo_placas"
        type: choice
        options: [solo_placas, prueba, normal]
      dias_adelante:
        description: "(prueba) rotar la selección N días para usar otros productos"
        default: "0"
      cantidad:
        description: "(prueba) cuántas placas publicar"
        default: "1"
      cada:
        description: "(prueba) minutos entre placas"
        default: "5"
      bienvenida:
        description: "(prueba) mandar antes el mensaje de bienvenida"
        default: "no"
        type: choice
        options: ["no", "si"]

concurrency:
  group: sitronik-canal-${{ inputs.modo || 'normal' }}
  cancel-in-progress: false

permissions: { contents: write }

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pillow beautifulsoup4
      - name: Bajar registro de enviados
        run: git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > registro.json || echo "{}" > registro.json
      - name: Armar placas y agenda del día
        env:
          REGISTRO: registro.json
          META_TOKEN: ${{ secrets.META_TOKEN_SITRONIK }}
          IG_USER_ID: ${{ secrets.SITRONIK_IG_USER_ID }}
          DIAS_ADELANTE: ${{ inputs.dias_adelante }}
        run: python sitronik/canal/armar_dia.py --salida sitronik_dia
      - uses: actions/upload-artifact@v4
        with:
          name: sitronik-dia
          path: sitronik_dia/
          retention-days: 3

  prueba:
    needs: armar
    if: inputs.modo == 'prueba'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sitronik-dia, path: sitronik_dia }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Bajar registro de enviados
        run: git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > registro.json || echo "{}" > registro.json
      - name: Publicar una placa ahora
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN_SITRONIK || secrets.WHAPI_TOKEN }}
          WHAPI_CANAL: ${{ secrets.WHAPI_CANAL_SITRONIK }}
          NOMBRE_CANAL: sitronik
          REGISTRO: registro.json
        run: |
          python sitronik/canal/registro.py filtrar sitronik_dia/agenda.json registro.json
          python3 sitronik/canal/prueba.py sitronik_dia/agenda.json "${{ inputs.cantidad }}" "${{ inputs.bienvenida }}"
          python publicador.py --agenda sitronik_dia/agenda.json --desde 00:00 --hasta 23:59 --cada "${{ inputs.cada }}"
      - name: Guardar registro de enviados
        if: always()
        run: |
          git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > remoto.json || echo "{}" > remoto.json
          mkdir -p /tmp/reg && python sitronik/canal/registro.py unir registro.json remoto.json /tmp/reg/registro.json
          cd /tmp/reg && git init -q && git checkout -q -b sitronik-registro && git add . \
          && git -c user.name=bot -c user.email=bot@x commit -qm registro \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sitronik-registro

  tramo-1:
    needs: armar
    if: github.event_name == 'schedule' || inputs.modo == 'normal'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sitronik-dia, path: sitronik_dia }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Bajar registro de enviados
        run: git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > registro.json || echo "{}" > registro.json
      - name: Publicar hasta las 13:59
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN_SITRONIK || secrets.WHAPI_TOKEN }}
          WHAPI_CANAL: ${{ secrets.WHAPI_CANAL_SITRONIK }}
          NOMBRE_CANAL: sitronik
          REGISTRO: registro.json
        run: |
          python sitronik/canal/registro.py filtrar sitronik_dia/agenda.json registro.json
          if [ -z "$WHAPI_TOKEN" ]; then echo "Todavia no esta cargado el secreto WHAPI_TOKEN_SITRONIK: no publico."; exit 0; fi
          python publicador.py --agenda sitronik_dia/agenda.json --desde 00:00 --hasta 13:59
      - name: Guardar registro de enviados
        if: always()
        run: |
          git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > remoto.json || echo "{}" > remoto.json
          mkdir -p /tmp/reg && python sitronik/canal/registro.py unir registro.json remoto.json /tmp/reg/registro.json
          cd /tmp/reg && git init -q && git checkout -q -b sitronik-registro && git add . \
          && git -c user.name=bot -c user.email=bot@x commit -qm registro \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sitronik-registro

  tramo-2:
    needs: tramo-1
    if: always() && needs.tramo-1.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sitronik-dia, path: sitronik_dia }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Bajar registro de enviados
        run: git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > registro.json || echo "{}" > registro.json
      - name: Publicar de 14:00 a 18:59
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN_SITRONIK || secrets.WHAPI_TOKEN }}
          WHAPI_CANAL: ${{ secrets.WHAPI_CANAL_SITRONIK }}
          NOMBRE_CANAL: sitronik
          REGISTRO: registro.json
        run: |
          python sitronik/canal/registro.py filtrar sitronik_dia/agenda.json registro.json
          if [ -z "$WHAPI_TOKEN" ]; then echo "Todavia no esta cargado el secreto WHAPI_TOKEN_SITRONIK: no publico."; exit 0; fi
          python publicador.py --agenda sitronik_dia/agenda.json --desde 14:00 --hasta 18:59
      - name: Guardar registro de enviados
        if: always()
        run: |
          git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > remoto.json || echo "{}" > remoto.json
          mkdir -p /tmp/reg && python sitronik/canal/registro.py unir registro.json remoto.json /tmp/reg/registro.json
          cd /tmp/reg && git init -q && git checkout -q -b sitronik-registro && git add . \
          && git -c user.name=bot -c user.email=bot@x commit -qm registro \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sitronik-registro

  tramo-3:
    needs: tramo-2
    if: always() && needs.tramo-1.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: sitronik-dia, path: sitronik_dia }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - name: Bajar registro de enviados
        run: git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > registro.json || echo "{}" > registro.json
      - name: Publicar de 19:00 a 23:59
        env:
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN_SITRONIK || secrets.WHAPI_TOKEN }}
          WHAPI_CANAL: ${{ secrets.WHAPI_CANAL_SITRONIK }}
          NOMBRE_CANAL: sitronik
          REGISTRO: registro.json
        run: |
          python sitronik/canal/registro.py filtrar sitronik_dia/agenda.json registro.json
          if [ -z "$WHAPI_TOKEN" ]; then echo "Todavia no esta cargado el secreto WHAPI_TOKEN_SITRONIK: no publico."; exit 0; fi
          python publicador.py --agenda sitronik_dia/agenda.json --desde 19:00 --hasta 23:59
      - name: Guardar registro de enviados
        if: always()
        run: |
          git fetch -q origin sitronik-registro && git show origin/sitronik-registro:registro.json > remoto.json || echo "{}" > remoto.json
          mkdir -p /tmp/reg && python sitronik/canal/registro.py unir registro.json remoto.json /tmp/reg/registro.json
          cd /tmp/reg && git init -q && git checkout -q -b sitronik-registro && git add . \
          && git -c user.name=bot -c user.email=bot@x commit -qm registro \
          && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sitronik-registro
